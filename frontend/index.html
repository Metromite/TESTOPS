<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Paint the correct theme before React/CSS hydration to avoid a first-frame flash. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme-mode");
          var theme = savedTheme === "dark" || savedTheme === "high_contrast" || savedTheme === "light" ? savedTheme : "light";
          document.documentElement.setAttribute("data-theme", theme);

          var cache = JSON.parse(localStorage.getItem("dispatchops-wallpaper-cache-v1") || "{}");
          var wallpaperTheme = theme === "dark" || theme === "high_contrast" ? "dark" : "light";
          var current = cache && cache[wallpaperTheme] && cache[wallpaperTheme].url;
          if (current) {
            var preload = document.createElement("link");
            preload.rel = "preload";
            preload.as = "image";
            preload.fetchPriority = "high";
            preload.href = current;
            document.head.appendChild(preload);
          }
        } catch (_) {}
      })();
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Dispatch OPS</title>

    <link rel="icon" type="image/png" sizes="128x128" href="/app-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" sizes="128x128" href="/app-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json?v=2" />

    <!-- LOGI: start both self-hosted Spline binaries before React mounts. -->
    <link rel="preload" href="/scene-clean.splinecode" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/scene-clean-6.splinecode" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/logi-company-engraving.png" as="image" fetchpriority="high" />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Dispatch OPS"
    />

    <meta
      name="theme-color"
      content="#07111f"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <script>
      (function () {
        try {
          var theme = document.documentElement.getAttribute("data-theme") || "light";
          var cache = JSON.parse(localStorage.getItem("dispatchops-wallpaper-cache-v1") || "{}");
          var dark = cache && cache.dark && cache.dark.url;
          var light = cache && cache.light && cache.light.url;
          var root = document.documentElement;
          root.style.setProperty("--dispatchops-wallpaper-dark", dark ? 'url("' + dark.replace(/"/g, '\\"') + '")' : "none");
          root.style.setProperty("--dispatchops-wallpaper-light", light ? 'url("' + light.replace(/"/g, '\\"') + '")' : "none");
          if (dark || light) document.body.classList.add("custom-bg");
          document.body.style.setProperty("--dispatchops-wallpaper-overlay", theme === "dark" || theme === "high_contrast"
            ? "linear-gradient(180deg, rgba(4,12,22,.22), rgba(4,12,22,.34))"
            : "linear-gradient(180deg, rgba(255,255,255,.08), rgba(4,12,22,.16))");
          var current = theme === "dark" || theme === "high_contrast" ? dark : light;
          if (current) {
            var img = document.createElement("img");
            img.src = current;
            img.alt = "";
            img.setAttribute("aria-hidden", "true");
            img.decoding = "async";
            img.fetchPriority = "high";
            img.className = "dispatchops-initial-wallpaper";
            document.body.appendChild(img);
          }
        } catch (_) {}
      })();
    </script>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
