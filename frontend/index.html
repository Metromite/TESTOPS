<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispatch OPS</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #export-progress-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
      #export-progress-card{width:min(430px,calc(100vw - 32px));padding:24px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.12);box-shadow:0 24px 70px rgba(15,23,42,.22);font-family:DM Sans,system-ui,sans-serif}
      #export-progress-title{font-size:18px;font-weight:800;color:#111827;margin-bottom:6px}
      #export-progress-text{font-size:13px;color:#64748b;margin-bottom:15px}
      #export-progress-track{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden}
      #export-progress-fill{height:100%;width:3%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:width .18s ease}
      #export-progress-percent{margin-top:8px;text-align:right;font:700 12px JetBrains Mono,monospace;color:#2563eb}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="export-progress-overlay" aria-live="polite" aria-busy="false">
      <div id="export-progress-card">
        <div id="export-progress-title">Preparing Excel download…</div>
        <div id="export-progress-text">Starting export immediately. Please keep this page open.</div>
        <div id="export-progress-track"><div id="export-progress-fill"></div></div>
        <div id="export-progress-percent">3%</div>
      </div>
    </div>
    <script>
      (() => {
        const originalOpen = window.open.bind(window);
        const overlay = () => document.getElementById('export-progress-overlay');
        const fill = () => document.getElementById('export-progress-fill');
        const text = () => document.getElementById('export-progress-text');
        const pct = () => document.getElementById('export-progress-percent');
        let timer = null;

        function show(){
          const o=overlay(); if(!o)return;
          o.style.display='flex'; o.setAttribute('aria-busy','true');
          fill().style.width='3%'; pct().textContent='3%';
          text().textContent='Starting export immediately. Preparing the Excel file…';
          clearInterval(timer);
          let p=3;
          timer=setInterval(()=>{ if(p<12){p++;fill().style.width=p+'%';pct().textContent=p+'%';}},180);
        }

        function hide(){
          clearInterval(timer); timer=null;
          const o=overlay();
          if(o){o.style.display='none';o.setAttribute('aria-busy','false');}
        }

        function triggerDownload(blob,url){
          const a=document.createElement('a');
          a.href=URL.createObjectURL(blob);
          a.download=(new URL(url,window.location.origin).searchParams.get('filename')||'DispatchOPS_Dashboard.xlsx');
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(a.href),10000);
        }

        async function downloadExport(url){
          show();
          const requestUrl = new URL(url, window.location.origin).href;
          try{
            if('caches' in window){
              const cache=await caches.open('price-change-excel-v1');
              const cached=await cache.match(requestUrl);
              if(cached){
                text().textContent='Using the prepared export…';
                fill().style.width='96%'; pct().textContent='96%';
                const blob=await cached.blob();
                triggerDownload(blob,requestUrl);
                fill().style.width='100%'; pct().textContent='100%';
                setTimeout(hide,250);
                return;
              }
            }

            const token=localStorage.getItem('access_token')||'';
            const response=await fetch(requestUrl,{
              headers:token?{Authorization:'Bearer '+token}:{},
              cache:'no-store'
            });

            if(!response.ok){
              if(response.status===401){
                localStorage.removeItem('access_token');
                localStorage.removeItem('role');
                window.location.href='/login';
                return;
              }
              throw new Error('Export request failed ('+response.status+')');
            }

            const total=Number(response.headers.get('content-length')||0);
            if(!response.body){
              const blob=await response.blob();
              triggerDownload(blob,requestUrl);
              fill().style.width='100%'; pct().textContent='100%';
              setTimeout(hide,250);
              return;
            }

            const reader=response.body.getReader();
            let received=0;
            const chunks=[];
            text().textContent=total
              ? 'Excel is ready. Downloading…'
              : 'Excel is being generated. Downloading as soon as it is ready…';

            while(true){
              const part=await reader.read();
              if(part.done)break;
              chunks.push(part.value);
              received+=part.value.byteLength;
              const p=total
                ? Math.min(99,12+Math.round(received/total*87))
                : Math.min(94,12+Math.floor(received/65536));
              fill().style.width=p+'%';
              pct().textContent=p+'%';
            }

            const blob=new Blob(chunks,{
              type:response.headers.get('content-type')||
                'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });

            if('caches' in window){
              try{
                const cache=await caches.open('price-change-excel-v1');
                await cache.put(requestUrl,new Response(blob,{headers:{'Content-Type':blob.type}}));
              }catch(_){}
            }

            triggerDownload(blob,requestUrl);
            fill().style.width='100%'; pct().textContent='100%';
            text().textContent='Download complete.';
            setTimeout(hide,450);
          }catch(err){
            clearInterval(timer); timer=null;
            text().textContent=err&&err.message?err.message:'Download failed.';
            fill().style.width='100%'; pct().textContent='Failed';
            setTimeout(hide,1800);
          }
        }

        window.open=function(url,target,features){
          try{
            const u=new URL(url,window.location.origin);
            if(u.pathname==='/api/dashboard/export-excel'){
              downloadExport(u.href);
              return null;
            }
          }catch(_){}
          return originalOpen(url,target,features);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
