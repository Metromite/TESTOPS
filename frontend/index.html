<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispatch OPS</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #export-progress-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.28);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
      #export-progress-card{width:min(430px,calc(100vw - 32px));padding:24px;border-radius:20px;background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.12);box-shadow:0 24px 70px rgba(15,23,42,.22);font-family:DM Sans,system-ui,sans-serif}
      #export-progress-title{font-size:18px;font-weight:800;color:#111827;margin-bottom:6px}
      #export-progress-text{font-size:13px;color:#64748b;margin-bottom:15px}
      #export-progress-track{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden}
      #export-progress-fill{height:100%;width:3%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#38bdf8);transition:width .18s ease}
      #export-progress-percent{margin-top:8px;text-align:right;font:700 12px JetBrains Mono,monospace;color:#2563eb}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="export-progress-overlay" aria-live="polite" aria-busy="false">
      <div id="export-progress-card">
        <div id="export-progress-title">Preparing Excel download…</div>
        <div id="export-progress-text">Starting export immediately. Please keep this page open.</div>
        <div id="export-progress-track"><div id="export-progress-fill"></div></div>
        <div id="export-progress-percent">3%</div>
      </div>
    </div>
    <script>
      (() => {
        const originalOpen = window.open.bind(window);
        let timer = null;
        const $ = id => document.getElementById(id);
        function show(){
          $('export-progress-overlay').style.display='flex';
          $('export-progress-overlay').setAttribute('aria-busy','true');
          $('export-progress-fill').style.width='3%'; $('export-progress-percent').textContent='3%';
          $('export-progress-text').textContent='Starting export immediately. Preparing the Excel file…';
          clearInterval(timer); let p=3;
          timer=setInterval(()=>{if(p<12){p++;$('export-progress-fill').style.width=p+'%';$('export-progress-percent').textContent=p+'%';}},180);
        }
        function hide(){clearInterval(timer);timer=null;$('export-progress-overlay').style.display='none';$('export-progress-overlay').setAttribute('aria-busy','false');}
        function saveBlob(blob,url){
          const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
          a.download=(new URL(url,location.origin).searchParams.get('filename')||'DispatchOPS_Dashboard.xlsx');
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000);
        }
        async function exportExcel(url){
          show();
          try{
            const token=localStorage.getItem('access_token')||'';
            const r=await fetch(url,{headers:token?{Authorization:'Bearer '+token}:{},cache:'no-store'});
            if(!r.ok){
              if(r.status===401){localStorage.removeItem('access_token');localStorage.removeItem('role');location.href='/login';return;}
              throw new Error('Export request failed ('+r.status+')');
            }
            const total=Number(r.headers.get('content-length')||0);
            if(!r.body){
              const b=await r.blob(); saveBlob(b,url); $('export-progress-fill').style.width='100%';$('export-progress-percent').textContent='100%';setTimeout(hide,300);return;
            }
            const reader=r.body.getReader(),chunks=[]; let received=0;
            $('export-progress-text').textContent=total?'Excel is ready. Downloading…':'Excel is being generated. Downloading as soon as it is ready…';
            while(true){
              const part=await reader.read(); if(part.done)break; chunks.push(part.value); received+=part.value.byteLength;
              const p=total?Math.min(99,12+Math.round(received/total*87)):Math.min(94,12+Math.floor(received/65536));
              $('export-progress-fill').style.width=p+'%';$('export-progress-percent').textContent=p+'%';
            }
            saveBlob(new Blob(chunks,{type:r.headers.get('content-type')||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url);
            $('export-progress-fill').style.width='100%';$('export-progress-percent').textContent='100%';$('export-progress-text').textContent='Download complete.';setTimeout(hide,450);
          }catch(e){$('export-progress-text').textContent=e?.message||'Download failed.';$('export-progress-percent').textContent='Failed';setTimeout(hide,1800);}
        }
        window.open=function(url,target,features){
          try{const u=new URL(url,location.origin);if(u.pathname==='/api/dashboard/export-excel'){exportExcel(u.href);return null;}}catch(e){}
          return originalOpen(url,target,features);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
