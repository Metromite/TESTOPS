<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DispatchOPS • Driver Portal</title>
<style>
:root{--bg:#07111f;--bg2:#0b1830;--glass:rgba(18,31,54,.68);--line:rgba(160,190,235,.16);--text:#f4f7fb;--muted:#9eacc3;--blue:#4f8cff;--cyan:#61d8ff;--green:#57e6a1;--red:#ff7184;--shadow:0 24px 70px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#163663 0,transparent 35%),radial-gradient(circle at 90% 10%,#10385b 0,transparent 32%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.02));backdrop-filter:blur(10px)}main{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 48px;position:relative}.glass{background:linear-gradient(145deg,rgba(30,52,86,.68),rgba(10,22,40,.62));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#eee;display:block;box-shadow:0 10px 30px rgba(50,117,255,.25)}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.customer{padding:18px;border-radius:18px;background:rgba(6,16,31,.34);border:1px solid rgba(160,190,235,.12);margin-top:12px}.customer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(79,140,255,.13);border:1px solid rgba(79,140,255,.25);font-size:12px;color:#cfe0ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}label{font-size:13px;color:#c8d4e7}input,textarea,button{font:inherit}input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,20,.46);color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:rgba(79,140,255,.65);box-shadow:0 0 0 3px rgba(79,140,255,.1)}input[readonly],.locked-location{opacity:.85}.locked-location{padding:12px 13px;border-radius:12px;border:1px solid rgba(87,230,161,.24);background:rgba(87,230,161,.06);min-height:46px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.055);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);border-color:rgba(150,220,255,.35);font-weight:800}.btn.danger{color:#ffd3d8;border-color:rgba(255,113,132,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}.item{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;padding:14px 0;border-bottom:1px solid rgba(160,190,235,.1)}.item:last-child{border-bottom:0}.prices{font-size:13px;color:var(--muted);margin-top:5px}.qty-input{font-size:21px!important;font-weight:900;text-align:center;padding:15px!important;min-height:54px}.no-stock-box{padding:18px 18px}.no-stock-label{font-size:19px!important;min-height:30px}.no-stock-label input{width:26px!important;height:26px!important}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.saved-evidence{margin-top:8px;padding:10px 12px;border:1px solid rgba(87,230,161,.22);border-radius:12px;background:rgba(87,230,161,.06);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.saved-evidence a{color:#cfe9ff;text-decoration:none;font-weight:800}.saved-signature{margin-top:8px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid rgba(160,190,235,.25);min-height:110px;display:flex;align-items:center;justify-content:center}.saved-signature img{max-width:100%;max-height:110px;object-fit:contain}.signature-wrap{height:150px;border:1px dashed rgba(160,190,235,.25);border-radius:14px;background:#fff;overflow:hidden}.signature-wrap canvas{width:100%;height:100%;touch-action:none;display:block}.small{font-size:12px}.success{color:var(--green)}.error{color:var(--red)}.hide{display:none!important}.login{max-width:560px;margin:7vh auto 0}.login .glass{padding:28px}.login-logo{width:92px;height:92px;border-radius:20px;object-fit:contain;background:#eee;box-shadow:0 16px 40px rgba(50,117,255,.25)}.menu-btn{width:48px;height:48px;padding:0;font-size:25px;border-radius:14px}.drawer{position:fixed;z-index:50;top:0;right:0;width:min(360px,88vw);height:100vh;padding:18px;background:rgba(8,18,34,.96);border-left:1px solid var(--line);box-shadow:-25px 0 60px rgba(0,0,0,.35);backdrop-filter:blur(22px);transform:translateX(105%);transition:transform .2s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-backdrop{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(2px)}.menu-item{width:100%;justify-content:flex-start;padding:14px 15px;margin-top:8px;font-weight:700}.submission{padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.035)}.no-stock-box{padding:15px 16px;border:1px solid rgba(97,216,255,.22);border-radius:14px;background:rgba(79,140,255,.07)}.no-stock-label{font-size:16px!important;font-weight:800!important;display:flex;align-items:center;gap:11px}.no-stock-label input{width:22px;height:22px;accent-color:#4f8cff;flex:0 0 auto}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toast{position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,90vw);padding:12px 16px;border-radius:14px;background:rgba(9,22,42,.95);border:1px solid var(--line);box-shadow:var(--shadow)}@media(max-width:760px){main{width:min(100% - 14px,1180px);padding-top:8px}.glass{border-radius:18px;padding:16px}.item{grid-template-columns:1fr 100px}.evidence{grid-template-columns:1fr}.top{align-items:flex-start}.top .btn{padding:9px 11px}.brand-logo{width:50px;height:50px}}
</style></head><body><main>

const TOKEN_KEY='dispatchops.driver.session';const CREDS_KEY='dispatchops.driver.credentials';
const api=(path,body)=>fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.message||x.error||'Request failed');return x});
let token=localStorage.getItem(TOKEN_KEY)||'',lastData=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){const x=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!x?.driver)throw new Error('Session expired');lastData=x;document.querySelector('#login').classList.add('hide');document.querySelector('#app').classList.remove('hide');document.querySelector('#driverName').textContent=x.driver.name||x.driver.code;document.querySelector('#driverMeta').textContent=(x.driver.code||'')+' · '+(x.driver.division||'');render(x.campaigns||[]);buildSubmissionList()}
function render(campaigns){const root=document.querySelector('#campaigns');root.innerHTML='';if(!campaigns.length){root.innerHTML='<div class="glass"><h3>No open price-change list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of campaigns){const card=document.createElement('section');card.className='glass';card.dataset.campaign=c.campaign.id;card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Complete the assigned customer visits below. Server date/time is recorded automatically.</div><div class="customers"></div>';const host=card.querySelector('.customers');for(const a of c.assignments||[])renderCustomer(host,c,a);root.appendChild(card)}}
function renderCustomer(host,c,a){const wrap=document.createElement('div');wrap.className='customer';wrap.dataset.assignmentId=a.id;const existing=(c.visits||[]).find(v=>v.assignment_id===a.id);if(existing)wrap.dataset.visitId=existing.id||'';wrap.dataset.attachmentPath=existing?.attachment_path||'';
wrap.innerHTML='<div class="customer-head"><div><div class="eyebrow">Assigned customer</div><h3 class="ctitle" style="margin:4px 0">'+(esc(a.customer_name)||'Customer name required')+'</h3></div><div class="small muted">'+(a.telephone?esc(a.telephone):'Telephone optional')+'</div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name <b style="color:var(--red)">*</b></label><input class="customer-name" value="'+esc(existing?.customer_name||a.customer_name) +'" placeholder="Enter pharmacy name"></div><div class="field"><label>Area <b style="color:var(--red)">*</b></label><select class="location"><option value="">Choose area</option>'+(c.areas||[]).map(ar=>'<option value="'+esc(ar.area_name)+'"'+((existing?.location||a.location||'')===ar.area_name?' selected':'')+'>'+esc(ar.area_name)+'</option>').join('')+'</select></div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="telephone" value="'+esc(existing?.telephone||a.telephone||'')+'" placeholder="Optional"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name <b style="color:var(--red)">*</b></label><input class="pharmacist" placeholder="Required before submit"></div><div class="field"><label>Pharmacy / place photo <b style="color:var(--red)">*</b></label><input class="photo" type="file" accept="image/*"><div class="saved-photo-slot"></div><div class="small muted">Existing saved photo is kept when editing unless you choose a new photo.</div></div></div><div class="no-stock-box" style="margin-top:12px"><label class="no-stock-label"><input class="no-stock" type="checkbox"> No Stock — nothing repriced at this customer</label><div class="small muted" style="margin-top:5px">Use this only when no item was repriced.</div></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><div class="saved-signature-slot"></div><div class="signature-wrap"><canvas class="signature"></canvas></div><div class="row" style="margin-top:7px"><button class="btn clear-sign" type="button">Clear signature</button><span class="small muted sig-status">You can sign immediately — Clear is not required before drawing.</span></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2"></textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit visit</button><button class="btn danger delete hide" type="button">Delete my submission</button><span class="msg small"></span></div>';
const ih=wrap.querySelector('.items');const assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));for(const item of c.items||[]){if(!assigned.has(item.id))continue;const r=document.createElement('div');r.className='item';const old=(existing?.price_change_visit_items||[]).find(vi=>vi.item_id===item.id);r.innerHTML='<div><strong>'+esc(item.line_no)+'. '+esc(item.item_description)+'</strong><div class="prices">New Price: '+esc(item.new_public_price??item.new_pharmacy_price??'—')+'</div></div><div class="field qty"><label>Quantity</label><input class="qty-input" data-item="'+item.id+'" type="number" min="0" step="1" value="'+(old?.quantity??'')+'"></div>';ih.appendChild(r)}
if(existing){wrap.querySelector('.pharmacist').value=existing.pharmacist_name||'';wrap.querySelector('.notes').value=existing.notes||'';if(existing.status==='NO_STOCK')wrap.querySelector('.no-stock').checked=true;wrap.querySelector('.delete').classList.remove('hide');if(existing.attachment_path){const box=wrap.querySelector('.saved-photo-slot');box.innerHTML='<div class="saved-evidence"><span>✓ Existing pharmacy photo saved</span><button type="button" class="btn view-existing-photo">Open photo</button></div>';box.querySelector('.view-existing-photo').onclick=async()=>{try{const u=await signEvidenceForDriver(existing.attachment_path);if(u)window.open(u,'_blank','noopener,noreferrer')}catch(e){setMsg(wrap.querySelector('.msg'),e.message||'Could not open saved photo')}}}if(existing.signature_path){const box=wrap.querySelector('.saved-signature-slot');box.innerHTML='<div class="saved-evidence"><span>✓ Existing signature saved</span><button type="button" class="btn view-existing-signature">Open signature</button></div>';box.querySelector('.view-existing-signature').onclick=async()=>{try{const u=await signEvidenceForDriver(existing.signature_path);if(u)window.open(u,'_blank','noopener,noreferrer')}catch(e){setMsg(wrap.querySelector('.msg'),e.message||'Could not open saved signature')}}}}
setupSignature(wrap.querySelector('.signature'),wrap.querySelector('.clear-sign'),wrap.querySelector('.sig-status'));
wrap.querySelector('.save').onclick=()=>saveVisit(c,a,wrap);wrap.querySelector('.delete').onclick=async()=>{if(!wrap.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:wrap.dataset.visitId});toast('Submission deleted');await load()}catch(e){setMsg(wrap.querySelector('.msg'),e.message)}};host.appendChild(wrap)}
function setupSignature(canvas,clear,status){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let drawing=false,hasDrawn=false;
  const resize=()=>{
    const r=canvas.getBoundingClientRect(),d=Math.max(1,window.devicePixelRatio||1),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));
    if(canvas.width!==w||canvas.height!==h){
      canvas.width=w;canvas.height=h;
      ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#000';
    } else {ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#000'}
  };
  resize();
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);resize();
  if(typeof ResizeObserver!=='undefined'){new ResizeObserver(resize).observe(canvas)}
  const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;hasDrawn=true;if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));
  clear.onclick=e=>{e.preventDefault();e.stopPropagation();drawing=false;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);hasDrawn=false;resize();if(status)status.textContent='Signature cleared completely'};
}

async function signEvidenceForDriver(path){if(!path)throw new Error('Evidence path is missing');const r=await fetch(SUPABASE_URL+'/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'sign_driver',token,path,expires_in:900})});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||x.message||'Could not open evidence');return String(x.signed_url||'')}
function canvasData(canvas){const ctx=canvas.getContext('2d');const a=ctx.getImageData(0,0,canvas.width,canvas.height).data;for(let i=3;i<a.length;i+=4)if(a[i]>0)return canvas.toDataURL('image/png');return null}
async function saveVisit(c,a,wrap){const msg=wrap.querySelector('.msg');setMsg(msg,'Saving…',true);const name=(wrap.querySelector('.customer-name')?.value||'').trim();const location=(wrap.querySelector('.location')?.value||'').trim();const pharm=(wrap.querySelector('.pharmacist')?.value||'').trim();const noStock=wrap.querySelector('.no-stock')?.checked===true;if(!name){setMsg(msg,'Customer name is required.');wrap.querySelector('.customer-name')?.focus();return}if(!location){setMsg(msg,'Location is required.');wrap.querySelector('.location')?.focus();return}if(!pharm){setMsg(msg,'Pharmacist name is required.');wrap.querySelector('.pharmacist')?.focus();return}const qtyEls=[...wrap.querySelectorAll('.qty-input')];const values=qtyEls.map(x=>x.value.trim()===''?0:Number(x.value));if(values.some(x=>!Number.isInteger(x)||x<0)){setMsg(msg,'Quantities must be whole numbers 0 or greater.');return}if(!noStock&&!values.some(x=>x>0)){setMsg(msg,'Enter a quantity greater than 0 for at least one item, or select No Stock.');return}if(noStock&&values.some(x=>x>0)){setMsg(msg,'No Stock cannot be selected when an item has a quantity.');return}const items=qtyEls.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));const photo=wrap.querySelector('.photo').files[0];let attachment_path=null,signature_path=null;try{if(photo)attachment_path=await uploadFile(photo,'photo');else if(!wrap.dataset.attachmentPath){setMsg(msg,'A pharmacy/place photo is required before saving.');return}const sig=canvasData(wrap.querySelector('.signature'));if(sig)signature_path=await uploadBase64(sig,'signature.png','image/png','signature');const payload={id:wrap.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location,telephone:wrap.querySelector('.telephone').value.trim(),pharmacist_name:pharm,notes:wrap.querySelector('.notes').value.trim(),attachment_path,signature_path,status:noStock?'NO_STOCK':'SUBMITTED',items};const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:payload});wrap.dataset.visitId=r.visit_id;wrap.dataset.attachmentPath=attachment_path||wrap.dataset.attachmentPath||'';wrap.querySelector('.delete').classList.remove('hide');setMsg(msg,noStock?'Saved — No Stock. Server date/time recorded.':'Saved successfully. Server date/time recorded.',true);toast('Visit saved successfully');await load()}catch(e){setMsg(msg,e.message||'Could not save')}}
async function uploadFile(file,kind){const data=await compress(file);return uploadBase64(data,file.name,file.type,kind)}
async function uploadBase64(data,name,type,kind){const raw=String(data||'').replace(/^data:[^,]*,/,'').replace(/\s/g,'');if(!raw)throw new Error('Evidence data is empty');const r=await fetch(SUPABASE_URL+'/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename:name,content_type:type,base64:raw,kind})});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||x.message||'Evidence upload failed');return x.path}
function compress(file){return new Promise((res,rej)=>{const im=new Image(),rd=new FileReader();rd.onload=()=>{im.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,im.width*s);cv.height=Math.max(1,im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.76).split(',')[1])};im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
function buildSubmissionList(){const root=document.querySelector('#submissionList');if(!root||!lastData)return;const visits=(lastData.campaigns||[]).flatMap(c=>(c.visits||[]).map(v=>({...v,campaign:c})));root.innerHTML='<div class="eyebrow">Your submitted visits</div>';if(!visits.length){root.innerHTML+='<p class="muted small">No submissions yet.</p>';return}for(const v of visits){const el=document.createElement('div');el.className='submission';el.innerHTML='<strong>'+esc(v.customer_name||'Unnamed customer')+'</strong><div class="small muted">'+esc(v.location||'')+' · '+esc(v.status||'SUBMITTED')+'</div><div class="small muted">'+(v.visited_at?new Date(v.visited_at).toLocaleString():'')+'</div><button class="btn menu-item" data-visit="'+esc(v.id)+'">Edit this visit</button>';el.querySelector('button').onclick=()=>{closeMenu();const target=document.querySelector('[data-visit-id="'+CSS.escape(v.id)+'"]');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.style.outline='2px solid var(--cyan)';setTimeout(()=>target.style.outline='',1400)}};root.appendChild(el)}}
document.querySelector('#menuBtn').onclick=openMenu;document.querySelector('#closeMenu').onclick=closeMenu;document.querySelector('#drawerBackdrop').onclick=closeMenu;document.querySelector('#mySubmissions').onclick=()=>{buildSubmissionList();toast('Your submitted visits are shown in the menu')};document.querySelector('#refreshData').onclick=async()=>{try{await load();toast('Assignments refreshed')}catch(e){toast(e.message)}};document.querySelector('#newSubmission').onclick=()=>{closeMenu();const target=[...document.querySelectorAll('.customer')].find(x=>!x.dataset.visitId)||document.querySelector('.customer');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>target.querySelector('.customer-name')?.focus(),250)}};
(function restoreCreds(){try{const c=JSON.parse(localStorage.getItem(CREDS_KEY)||'null');if(c?.username){document.querySelector('#u').value=c.username;document.querySelector('#remember').checked=true;if(c.password)document.querySelector('#p').value=c.password}}catch{}})();
document.querySelector('#loginBtn').onclick=async()=>{const m=document.querySelector('#loginMsg');m.textContent='Signing in…';try{const username=document.querySelector('#u').value.trim(),password=document.querySelector('#p').value;if(!username||!password)throw new Error('Enter username and password');const x=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:username,p_password:password});token=x.token;localStorage.setItem(TOKEN_KEY,token);if(document.querySelector('#remember').checked)localStorage.setItem(CREDS_KEY,JSON.stringify({username,password}));else localStorage.removeItem(CREDS_KEY);await load()}catch(e){setMsg(m,e.message||'Invalid username or password')}};
document.querySelector('#logout').onclick=async()=>{try{if(token)await api('/rest/v1/rpc/dispatchops_driver_logout',{p_token:token})}catch{}localStorage.removeItem(TOKEN_KEY);token='';location.reload()};
if(token)load().catch(()=>{localStorage.removeItem(TOKEN_KEY);token=''});
